<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت - WW2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #0a0e14;
            color: #f4f6f9;
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #a0a8b3;
            font-size: 12px;
            margin-bottom: 24px;
        }

        /* ============ رمز ورود ============ */

        .login-box {
            max-width: 400px;
            margin: 80px auto;
            background: rgba(14, 18, 26, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .login-box input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f4f6f9;
            font-size: 14px;
            padding: 12px 14px;
            border-radius: 10px;
            font-family: inherit;
            outline: none;
            margin-bottom: 14px;
        }

        .login-box input:focus {
            border-color: #f0b429;
        }

        .login-box button {
            width: 100%;
            background: linear-gradient(135deg, #f0b429, #d99a1c);
            color: #0a0e14;
            font-weight: bold;
            font-size: 14px;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        .login-error {
            color: #f87171;
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
            min-height: 16px;
        }

        /* ============ داشبورد ============ */

        .dashboard {
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: rgba(14, 18, 26, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
        }

        .stat-card .value {
            font-size: 26px;
            font-weight: bold;
            color: #f0b429;
            margin-bottom: 4px;
        }

        .stat-card .label {
            font-size: 11px;
            color: #a0a8b3;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .toolbar button {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f4f6f9;
            font-size: 12px;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
        }

        .toolbar button:hover {
            background: rgba(240, 180, 41, 0.15);
            border-color: rgba(240, 180, 41, 0.4);
            color: #f0b429;
        }

        /* ============ جدول ============ */

        .table-wrapper {
            overflow-x: auto;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(14, 18, 26, 0.72);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12.5px;
            min-width: 900px;
        }

        thead {
            background: rgba(255, 255, 255, 0.03);
        }

        th {
            text-align: right;
            padding: 12px 14px;
            font-weight: 600;
            color: #a0a8b3;
            font-size: 11.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            white-space: nowrap;
        }

        td {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            vertical-align: middle;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: rgba(240, 180, 41, 0.04);
        }

        .user-id {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #f0b429;
            cursor: pointer;
            user-select: all;
        }

        .country-cell {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .flag {
            font-size: 18px;
        }

        .no-country {
            color: #6b7480;
            font-style: italic;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 10.5px;
            font-weight: 500;
        }

        .badge-taken {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .badge-empty {
            background: rgba(255, 255, 255, 0.05);
            color: #6b7480;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .action-btn {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: #f87171;
            font-size: 10.5px;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-left: 4px;
            font-family: inherit;
        }

        .action-btn:hover {
            background: rgba(248, 113, 113, 0.2);
        }

        .action-btn.reset {
            background: rgba(240, 180, 41, 0.1);
            border-color: rgba(240, 180, 41, 0.3);
            color: #f0b429;
        }

        .action-btn.reset:hover {
            background: rgba(240, 180, 41, 0.2);
        }

        .empty-msg {
            text-align: center;
            padding: 40px;
            color: #6b7480;
        }

        .copied-toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #4ade80;
            color: #0a0e14;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 999;
        }

        .copied-toast.show {
            opacity: 1;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f4f6f9;
            font-size: 12.5px;
            padding: 8px 14px;
            border-radius: 10px;
            font-family: inherit;
            outline: none;
        }

        .search-box:focus {
            border-color: rgba(240, 180, 41, 0.5);
        }

        @media (max-width: 600px) {
            body { padding: 12px; }
            h1 { font-size: 18px; }
            th, td { padding: 10px 8px; font-size: 11px; }
        }
    </style>
</head>
<body>

<!-- ورود -->

<div class="login-box" id="login-box">
    <h2>🛡️ ورود به پنل مدیریت</h2>
    <input
        type="password"
        id="secret-input"
        placeholder="رمز مدیریت را وارد کنید"
        onkeydown="if(event.key==='Enter') tryLogin()"
    >
    <button onclick="tryLogin()">ورود</button>
    <div class="login-error" id="login-error"></div>
</div>


<!-- داشبورد -->

<div class="dashboard" id="dashboard">

    <h1>🛡️ پنل مدیریت WW2</h1>
    <p class="subtitle">
        لیست کامل بازیکنان و کشورهای انتخاب‌شده
    </p>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="value" id="stat-total-players">0</div>
            <div class="label">کل بازیکنان</div>
        </div>
        <div class="stat-card">
            <div class="value" id="stat-with-country">0</div>
            <div class="label">دارای کشور</div>
        </div>
        <div class="stat-card">
            <div class="value" id="stat-countries-taken">0</div>
            <div class="label">کشورهای گرفته‌شده</div>
        </div>
        <div class="stat-card">
            <div class="value" id="stat-countries-total">8</div>
            <div class="label">کشورهای کل</div>
        </div>
    </div>

    <div class="toolbar">
        <input
            type="text"
            class="search-box"
            id="search-input"
            placeholder="جستجو بر اساس آیدی یا نام کشور..."
            oninput="renderPlayers()"
        >
        <button onclick="loadPlayers()">🔄 بروزرسانی</button>
        <button onclick="logout()">🚪 خروج</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>آیدی کاربر</th>
                    <th>کشور</th>
                    <th>وضعیت</th>
                    <th>پول</th>
                    <th>نیروی انسانی</th>
                    <th>قدرت نظامی</th>
                    <th>درآمد روزانه</th>
                    <th>شروع بازی</th>
                    <th>عملیات</th>
                </tr>
            </thead>
            <tbody id="players-tbody">
            </tbody>
        </table>
    </div>

</div>

<div class="copied-toast" id="copied-toast">
    ✅ کپی شد
</div>


<script>

let secret = "";
let playersData = [];


function tryLogin() {

    const input = document.getElementById("secret-input");
    const value = input.value.trim();

    if (!value) {
        document.getElementById("login-error").textContent =
            "رمز را وارد کنید.";
        return;
    }

    secret = value;

    fetch(`/api/admin/players?secret=${encodeURIComponent(secret)}`)
        .then(res => {
            if (res.status === 401) {
                throw new Error("unauthorized");
            }
            return res.json();
        })
        .then(data => {
            document.getElementById("login-box").style.display = "none";
            document.getElementById("dashboard").style.display = "block";
            localStorage.setItem("admin_secret", secret);
            applyData(data);
        })
        .catch(err => {
            document.getElementById("login-error").textContent =
                "رمز اشتباه است یا خطایی رخ داد.";
            secret = "";
        });
}


function logout() {
    localStorage.removeItem("admin_secret");
    location.reload();
}


function loadPlayers() {

    if (!secret) return;

    fetch(`/api/admin/players?secret=${encodeURIComponent(secret)}`)
        .then(res => {
            if (res.status === 401) {
                logout();
                return;
            }
            return res.json();
        })
        .then(data => {
            if (data) applyData(data);
        })
        .catch(err => console.error(err));
}


function applyData(data) {

    playersData = data.players || [];

    document.getElementById("stat-total-players").textContent =
        data.total_players;
    document.getElementById("stat-with-country").textContent =
        data.total_with_country;
    document.getElementById("stat-countries-taken").textContent =
        data.countries_taken;
    document.getElementById("stat-countries-total").textContent =
        data.countries_total;

    renderPlayers();
}


function formatNumber(n) {

    return Math.round(Number(n || 0)).toLocaleString("en-US");
}


function formatMoney(n) {

    return "$" + formatNumber(n);
}


function formatDate(iso) {

    if (!iso) return "—";

    try {
        const d = new Date(iso);

        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        const h = String(d.getHours()).padStart(2, "0");
        const min = String(d.getMinutes()).padStart(2, "0");

        return `${y}/${m}/${day} ${h}:${min}`;
    } catch (e) {
        return "—";
    }
}


function renderPlayers() {

    const tbody = document.getElementById("players-tbody");
    const search = (
        document.getElementById("search-input").value || ""
    ).trim().toLowerCase();

    let list = playersData;

    if (search) {
        list = list.filter(p => {
            const idMatch = String(p.user_id).includes(search);
            const countryMatch =
                (p.country_name || "").toLowerCase().includes(search);
            const countryIdMatch =
                (p.country_id || "").toLowerCase().includes(search);
            return idMatch || countryMatch || countryIdMatch;
        });
    }

    if (!list.length) {
        tbody.innerHTML = `
            <tr>
                <td colspan="9" class="empty-msg">
                    هیچ بازیکنی پیدا نشد.
                </td>
            </tr>
        `;
        return;
    }

    tbody.innerHTML = list.map(p => {

        const countryCell = p.has_country
            ? `<div class="country-cell">
                <span class="flag">${p.country_flag}</span>
                <span>${p.country_name}</span>
               </div>`
            : `<span class="no-country">انتخاب نکرده</span>`;

        const statusBadge = p.has_country
            ? `<span class="badge badge-taken">فعال</span>`
            : `<span class="badge badge-empty">بدون کشور</span>`;

        return `
            <tr>
                <td>
                    <span class="user-id" onclick="copyId(${p.user_id})" title="کلیک برای کپی">
                        ${p.user_id}
                    </span>
                </td>
                <td>${countryCell}</td>
                <td>${statusBadge}</td>
                <td>${formatMoney(p.money)}</td>
                <td>${formatNumber(p.manpower)}</td>
                <td>${formatNumber(p.army)}</td>
                <td style="color:#4ade80;">
                    ${formatMoney(p.daily_income)} / روز
                </td>
                <td style="font-size:11px;color:#a0a8b3;">
                    ${formatDate(p.started_at)}
                </td>
                <td>
                    <button class="action-btn reset"
                        onclick="resetPlayer(${p.user_id})">
                        ریست
                    </button>
                    <button class="action-btn"
                        onclick="kickPlayer(${p.user_id})">
                        حذف
                    </button>
                </td>
            </tr>
        `;
    }).join("");
}


function copyId(id) {

    navigator.clipboard.writeText(String(id)).then(() => {
        const toast = document.getElementById("copied-toast");
        toast.textContent = `✅ آیدی ${id} کپی شد`;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 1500);
    });
}


function resetPlayer(userId) {

    if (!confirm(`آیا از ریست بازیکن ${userId} مطمئنید؟`)) {
        return;
    }

    fetch(`/api/admin/reset-player?secret=${encodeURIComponent(secret)}&user_id=${userId}`)
        .then(res => res.json())
        .then(() => loadPlayers())
        .catch(err => console.error(err));
}


function kickPlayer(userId) {

    if (!confirm(`آیا از حذف کامل بازیکن ${userId} مطمئنید؟`)) {
        return;
    }

    fetch(`/api/admin/kick-player?secret=${encodeURIComponent(secret)}&user_id=${userId}`)
        .then(res => res.json())
        .then(() => loadPlayers())
        .catch(err => console.error(err));
}


// ورود خودکار اگه قبلاً لاگین شده

const savedSecret = localStorage.getItem("admin_secret");

if (savedSecret) {
    document.getElementById("secret-input").value = savedSecret;
    tryLogin();
}

// بروزرسانی خودکار هر ۳۰ ثانیه

setInterval(() => {
    if (secret) loadPlayers();
}, 30000);

</script>

</body>
</html>
